<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        <script>

            function f1(){
              x =   document.getElementById("demo");

                x.innerText = "hello friends";

              console.log(x);


                y = document.getElementById("d1");

                console.log(y);

                y.innerHTML = "<h2>THANK YOU </h2>";

            }
        </script>
   

</head>
<body  >

        <H1> Embedded JavaScript</H1>

        <div id="d1"></div>
      
        <p id="demo"></p>  <br>

        <button type="button"  onclick="f1()">Show</button>

</body>
</html>
